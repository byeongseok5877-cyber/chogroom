<main class="sub"><div class="wrap">
<h1>주문서</h1>
<p class="note" style="margin-bottom:28px">데모 사이트입니다. 입력한 정보는 저장되거나 전송되지 않고, 실제 결제도 일어나지 않아요.</p>
<form id="co-form" class="cols" novalidate>
  <div class="form">
    <div class="field"><label for="name">이름</label><input id="name" type="text" autocomplete="name" aria-describedby="name-err"><span class="fe" id="name-err" role="alert"></span></div>
    <div class="field"><label for="phone">연락처</label><input id="phone" type="tel" inputmode="tel" autocomplete="tel" placeholder="010-0000-0000" aria-describedby="phone-err"><span class="fe" id="phone-err" role="alert"></span></div>
    <div class="field"><label for="addr">주소</label><input id="addr" type="text" autocomplete="street-address" aria-describedby="addr-err"><span class="fe" id="addr-err" role="alert"></span></div>
    <fieldset class="pay"><legend>결제 수단 <span class="demo">데모</span></legend>
      <label><input type="radio" name="pay" checked> 카드 결제 (데모)</label>
      <label><input type="radio" name="pay"> 간편결제 (데모)</label>
    </fieldset>
  </div>
  <aside class="box stick">
    <h2 style="font-size:20px">주문 상품</h2>
    <ul class="sumlist" id="sum-list"></ul>
    <dl><dt>배송비</dt><dd id="c-ship"></dd><dt class="tot">결제 금액</dt><dd id="c-total"></dd></dl>
    <button type="submit" class="btn wide" id="pay-btn">결제하기 (데모)</button>
  </aside>
</form>
</div></main>
<footer class="site"><div class="wrap">
<b>첫그루밍</b>
<p class="warn">첫그루밍 (가상 브랜드 · 수업용 예시) 모든 수치와 후기는 가상입니다.</p>
<p>20~30대 남성을 위한 스킨케어 입문 키트. 이 사이트의 결제·주문은 데모이며 실제 청구나 배송이 없습니다.</p>
</div></footer>
